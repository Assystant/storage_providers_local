default_language_version:
  python: python3.11

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-json
      - id: check-merge-conflict
      - id: check-yaml
      - id: debug-statements
      # - id: detect-aws-credentials
      - id: detect-private-key
      - id: double-quote-string-fixer
      - id: end-of-file-fixer
      - id: mixed-line-ending
      # - id: name-tests-test
      # - id: pretty-format-json
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        stages: [pre-commit]
  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
    - id: isort
      name: isort
      description: This hook sorts imports in the files.
      stages: [pre-commit]
  - repo: https://github.com/pycqa/docformatter
    rev: v1.7.7
    hooks:
    - id: docformatter
      name: docformatter
      description: This hook formats inline docs.
      stages: [pre-commit]
  # - repo: https://github.com/pycqa/pylint
  #   rev: v3.0.3
  #   hooks:
  #   - id: pylint
  #     stages: [commit]
  # - repo: https://github.com/PyCQA/bandit
  #   rev: 1.7.6  # Use the ref you want to point at
  #   hooks:
  #   - id: bandit
  #     stages: [commit]
  # - repo: https://github.com/Lucas-C/pre-commit-hooks-safety
  #   rev: v1.3.3
  #   hooks:
  #   - id: python-safety-dependencies-check
  #     stages: [commit]
  # - repo: https://github.com/psf/black
  #   rev: 23.12.1
  #   hooks:
  #     - id: black
  #       stages: [commit]
  - repo: https://github.com/hhatto/autopep8
    rev: v2.3.2 # Use the ref you want to point at
    hooks:
    - id: autopep8
      name: autopep8
      entry: autopep8 --ignore=E501,W504
      language: python
      types: [python]
      stages: [pre-commit]
